name: Restore package dependency snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[package-snapshot-restored]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original dependency versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('package.json')
          s = p.read_text()
          replacements = {
              '"@radix-ui/react-popover": "1.1.29"': '"@radix-ui/react-popover": "1.1.23"',
              '"@radix-ui/react-separator": "^1.3.0"': '"@radix-ui/react-separator": "^1.1.15"',
              '"@radix-ui/react-slot": "1.2.0"': '"@radix-ui/react-slot": "^1.3.3"',
              '"@radix-ui/react-switch": "1.2.0"': '"@radix-ui/react-switch": "1.3.7"',
              '"react-day-picker": "^10.0.0"': '"react-day-picker": "^10.0.1"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-package-snapshot.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/fix-package-snapshot.yml
          git commit -m "chore: restore package dependency snapshot [package-snapshot-restored]"
          git push origin HEAD:main
