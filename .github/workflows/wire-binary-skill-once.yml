name: Install binary analysis skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime skill
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/system-prompt.ts')
          s = p.read_text()
          const_marker = 'type SecurityExecutionEnvironment = "ask" | "cloud" | "local-host";'
          skill = '''const LOCAL_BINARY_ANALYSIS_SKILL_SECTION = `<local_binary_analysis_skill>
Use Dr.Binary as the specialist binary-analysis backend in local Agent mode.

Workflow:
- prepare_upload: obtain the upload instructions for a local binary.
- Run the returned upload command with the HackerAI terminal tool.
- inspect_binary: collect format, architecture, sections, imports, exports, symbols, strings, and entrypoint evidence.
- run_sandbox: perform targeted reverse-engineering commands when needed.
- dump_data: obtain deeper decompilation/disassembly artifacts when triage is insufficient.
- list_files and read_file: inspect generated analysis artifacts.
- Correlate multiple observations and distinguish observed facts from hypotheses.
- Keep large binary data out of the LLM context; use the analysis backend and artifacts instead.
</local_binary_analysis_skill>`;'''
          if 'const LOCAL_BINARY_ANALYSIS_SKILL_SECTION' not in s:
              if const_marker not in s:
                  raise SystemExit('system prompt marker missing')
              s = s.replace(const_marker, skill + '\n\n' + const_marker, 1)

          section_marker = '    getFreshnessAndWebSearchSection(modelName),'
          section = '''    getFreshnessAndWebSearchSection(modelName),
    ...(mode === "agent" &&
    process.env.HACKERAI_LOCAL_MODEL === "true" &&
    process.env.DRBINARY_MCP_ENABLED !== "false"
      ? [LOCAL_BINARY_ANALYSIS_SKILL_SECTION]
      : []),'''
          if '? [LOCAL_BINARY_ANALYSIS_SKILL_SECTION]' not in s:
              if section_marker not in s:
                  raise SystemExit('system prompt sections marker missing')
              s = s.replace(section_marker, section, 1)

          p.write_text(s)
          PY
          grep -q 'LOCAL_BINARY_ANALYSIS_SKILL_SECTION' lib/system-prompt.ts
          grep -q 'DRBINARY_MCP_ENABLED' lib/system-prompt.ts

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/wire-binary-skill-once.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/system-prompt.ts .github/workflows/wire-binary-skill-once.yml
          git commit -m "feat: wire binary analysis skill into agent prompt [binary-skill-wired]"
          git push origin HEAD:main
