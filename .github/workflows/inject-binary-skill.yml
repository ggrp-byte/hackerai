name: Wire binary analysis skill into agent prompt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[binary-skill-wired]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject skill section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/system-prompt.ts')
          s = p.read_text()

          marker = 'type SecurityExecutionEnvironment = "ask" | "cloud" | "local-host";'
          section = '''const LOCAL_BINARY_ANALYSIS_SKILL_SECTION = `<local_binary_analysis_skill>
When running in local Agent mode with Dr.Binary enabled, use Dr.Binary as the specialist binary-analysis backend.

Workflow:
- Use prepare_upload for a local sample and execute the returned upload command with the local terminal tool.
- Start with inspect_binary for architecture, format, sections, imports, exports, strings, symbols, and entrypoint triage.
- Use run_sandbox for targeted reverse-engineering commands when triage is insufficient.
- Use dump_data for deeper decompilation or disassembly artifacts.
- Use list_files and read_file to inspect generated artifacts.
- Correlate multiple observations and separate observed facts from hypotheses.
- Prefer tool evidence over assumptions and do not paste large binary blobs into the model context.
</local_binary_analysis_skill>`;

          if 'const LOCAL_BINARY_ANALYSIS_SKILL_SECTION' not in s:
              if marker not in s:
                  raise SystemExit('system prompt marker not found')
              s = s.replace(marker, section + '\n\n' + marker, 1)

          push_marker = '    getFreshnessAndWebSearchSection(modelName),'
          push_text = '''    getFreshnessAndWebSearchSection(modelName),
    ...(mode === "agent" &&
    process.env.HACKERAI_LOCAL_MODEL === "true" &&
    process.env.DRBINARY_MCP_ENABLED !== "false"
      ? [LOCAL_BINARY_ANALYSIS_SKILL_SECTION]
      : []),'''

          if 'LOCAL_BINARY_ANALYSIS_SKILL_SECTION' in s and 'process.env.HACKERAI_LOCAL_MODEL' not in s.split('const securityExecutionEnvironment', 1)[0]:
              if push_marker not in s:
                  raise SystemExit('system prompt section marker not found')
              s = s.replace(push_marker, push_text, 1)

          p.write_text(s)
          PY

      - name: Validate TypeScript source shape
        run: |
          grep -q 'LOCAL_BINARY_ANALYSIS_SKILL_SECTION' lib/system-prompt.ts
          grep -q 'DRBINARY_MCP_ENABLED' lib/system-prompt.ts

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/inject-binary-skill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/system-prompt.ts .github/workflows/inject-binary-skill.yml
          git commit -m "feat: wire binary analysis skill into agent prompt [binary-skill-wired]"
          git push origin HEAD:main
