name: Patch local auth hook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace GlobalState WorkOS hooks with local-aware hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/contexts/GlobalState.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'import { useAccessToken, useAuth } from "@workos-inc/authkit-nextjs/components";'
          new = 'import { useAccessToken, useAuth } from "@/lib/auth/use-local-aware-auth";'
          if old not in s:
              raise SystemExit('expected GlobalState WorkOS import not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/patch-local-auth.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/contexts/GlobalState.tsx .github/workflows/patch-local-auth.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: route GlobalState auth through local-aware hook"
          git push origin HEAD:main
